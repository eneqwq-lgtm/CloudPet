<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
}
#pet {
    width: 100%; height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
#pet img {
    width: 90%; height: 90%;
    object-fit: contain;
    z-index: 1;
}
#bubble {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 95%;
    background: rgba(255,255,255,0.92);
    color: #333;
    padding: 1px 5px;
    border-radius: 6px;
    font-size: 8px;
    font-family: sans-serif;
    max-width: 130px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    pointer-events: none;
    line-height: 1.3;
}
#bubble.show {
    opacity: 1;
}
</style>
</head>
<body>
<div id="pet">
    <div id="bubble"></div>
</div>
<script>
var PET = {
    states: {
        idle:       { file: 'clawd-idle.gif',           text: '🦀' },
        thinking:   { file: 'clawd-thinking.gif',       text: '💭' },
        working:    { file: 'clawd-typing.gif',          text: '⌨️' },
        sleeping:   { file: 'clawd-sleeping.gif',        text: '💤' },
        celebrate:  { file: 'clawd-juggling.gif',        text: '🎉' },
        building:   { file: 'clawd-building.gif',        text: '🔧' },
        error:      { file: 'clawd-error.gif',           text: '😱' },
        reading:    { file: 'clawd-idle-reading.gif',    text: '📖' },
        happy:      { file: 'clawd-happy.gif',           text: '😊' },
        bubble:     { file: 'clawd-bubble.gif',          text: '🫧' },
        groove:     { file: 'clawd-headphones-groove.gif',text: '🎵' },
        notification: { file: 'clawd-notification.gif',   text: '🔔' },
        attention:  { file: 'clawd-notification.gif',    text: '👀' },
        annoyed:    { file: 'clawd-error.gif',            text: '😤' },
        juggling:   { file: 'clawd-juggling.gif',        text: '🤹' },
        carrying:   { file: 'clawd-carrying.gif',        text: '📦' },
        conducting: { file: 'clawd-conducting.gif',      text: '🎶' },
        sweeping:   { file: 'clawd-sweeping.gif',        text: '🧹' },
    },
    currentState: 'idle',
    currentFile: null,
    textTimer: null,

    init: function() {
        this.load('idle');
        window.petEngine = this;
    },

    load: function(state) {
        var s = this.states[state] || this.states.idle;
        this.currentFile = s.file;
        this.currentState = state;
        var container = document.getElementById('pet');
        var img = container.querySelector('img');
        if (img) {
            img.src = s.file;
            img.alt = state;
        } else {
            img = document.createElement('img');
            img.src = s.file;
            img.alt = state;
            img.style.width = '90%';
            img.style.height = '90%';
            img.style.objectFit = 'contain';
            container.insertBefore(img, container.firstChild);
        }
        this.showBubble(s.text);
    },

    showBubble: function(text) {
        var bubble = document.getElementById('bubble');
        if (!bubble) return;
        bubble.textContent = text;
        bubble.classList.add('show');
        if (this.textTimer) clearTimeout(this.textTimer);
        this.textTimer = setTimeout(function() {
            bubble.classList.remove('show');
        }, 2000);
    },

    setState: function(state) { this.load(state); },

    onTap: function() {
        var msgs = ['😊', '🦀', '👋', '🥰', '😄'];
        this.showBubble(msgs[Math.floor(Math.random() * msgs.length)]);
        this.load('happy');
        var self = this;
        setTimeout(function() { self.load(self.currentState); }, 1200);
    },

    onDoubleTap: function() {
        var msgs = ['🎉', '✨', '💕', '🦀🦀'];
        this.showBubble(msgs[Math.floor(Math.random() * msgs.length)]);
        this.load('juggling');
        var self = this;
        setTimeout(function() { self.load(self.currentState); }, 1500);
    },

    onLongPress: function() {
        var msgs = ['😤', '😒', '💢', '🦀'];
        this.showBubble(msgs[Math.floor(Math.random() * msgs.length)]);
        this.load('annoyed');
        var self = this;
        setTimeout(function() { self.load(self.currentState); }, 1000);
    }
};
PET.init();
</script>
</body>
</html>
