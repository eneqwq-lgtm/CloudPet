<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
}
#pet {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
}
#pet img {
    width: 100%; height: 100%;
    object-fit: contain;
}
</style>
</head>
<body>
<div id="pet"></div>
<script>
const PET = {
    states: {
        idle:       { svg: 'clawd-idle-look.svg',      gif: 'clawd-idle.gif' },
        thinking:   { svg: 'clawd-working-thinking.svg', gif: 'clawd-thinking.gif' },
        working:    { svg: 'clawd-working-typing.svg',   gif: 'clawd-typing.gif' },
        sleeping:   { svg: 'clawd-idle-reading.svg',    gif: 'clawd-sleeping.gif' },
        celebrate:  { svg: 'clawd-working-juggling.svg', gif: 'clawd-juggling.gif' },
        building:   { svg: 'clawd-working-building.svg', gif: 'clawd-building.gif' },
        error:      { svg: 'clawd-react-annoyed.svg',   gif: 'clawd-error.gif' },
        reading:    { svg: 'clawd-idle-reading.svg',    gif: 'clawd-idle-reading.gif' },
        happy:      { svg: 'clawd-react-annoyed.svg',   gif: 'clawd-happy.gif' },
        bubble:     { svg: 'clawd-idle-bubble.svg',     gif: 'clawd-bubble.gif' },
        groove:     { svg: 'clawd-headphones-groove.svg',gif: 'clawd-headphones-groove.gif' },
        notification: { svg: 'clawd-idle-bubble.svg',   gif: 'clawd-notification.gif' },
    },
    currentState: 'idle',
    useGif: true,

    init() {
        this.load('idle');
        window.petEngine = this;
    },

    load(state) {
        const assets = this.states[state] || this.states.idle;
        this.currentState = state;
        const container = document.getElementById('pet');
        const file = this.useGif ? assets.gif : assets.svg;
        
        const img = document.createElement('img');
        img.src = file;
        img.alt = state;
        img.style.width = '100%';
        img.style.height = '100%';
        container.innerHTML = '';
        container.appendChild(img);
    },

    setState(state) { this.load(state); },

    onTap() {
        this.load('bubble');
        setTimeout(() => this.load(this.currentState), 1000);
    },
    onDoubleTap() {
        this.load('happy');
        setTimeout(() => this.load(this.currentState), 1500);
    },
    onLongPress() {
        this.load('error');
        setTimeout(() => this.load(this.currentState), 800);
    }
};
PET.init();
</script>
</body>
</html>
