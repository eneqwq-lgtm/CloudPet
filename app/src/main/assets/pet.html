<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
}
#wrap {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 5%;
}
#bubble {
    background: rgba(255,255,255,0.9);
    color: #333;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 9px;
    font-family: sans-serif;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
    max-width: 90%;
    line-height: 1.4;
    margin-bottom: 2px;
}
#bubble.show { opacity: 1; }
#pet {
    width: 80%; flex: 1;
    display: flex; align-items: center; justify-content: center;
}
#pet img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
}
</style>
</head>
<body>
<div id="wrap">
    <div id="bubble"></div>
    <div id="pet"></div>
</div>
<script>
var PET = {
    states: {
        idle:       { file: 'clawd-idle.gif',           text: '🦀' },
        thinking:   { file: 'clawd-thinking.gif',       text: '💭' },
        working:    { file: 'clawd-typing.gif',          text: '⌨️' },
        sleeping:   { file: 'clawd-sleeping.gif',        text: '💤' },
        celebrate:  { file: 'clawd-juggling.gif',        text: '🎉' },
        error:      { file: 'clawd-error.gif',           text: '😱' },
        happy:      { file: 'clawd-happy.gif',           text: '😊' },
        annoyed:    { file: 'clawd-error.gif',            text: '😤' },
        juggling:   { file: 'clawd-juggling.gif',        text: '🤹' },
        reading:    { file: 'clawd-idle-reading.gif',    text: '📖' },
    },
    currentState: 'idle', curFile: null, timer: null,

    init() { this.load('idle'); window.petEngine = this; },

    load(state) {
        var s = this.states[state] || this.states.idle;
        this.curFile = s.file; this.currentState = state;
        var pet = document.getElementById('pet');
        var img = pet.querySelector('img');
        if (img) { img.src = s.file; img.alt = state; }
        else {
            img = document.createElement('img');
            img.src = s.file; img.alt = state;
            pet.appendChild(img);
        }
        this.bubble(s.text);
    },

    bubble(text) {
        var el = document.getElementById('bubble');
        if (!el) return;
        el.textContent = text; el.classList.add('show');
        if (this.timer) clearTimeout(this.timer);
        this.timer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
    },

    setState(s) { this.load(s); },

    onTap() {
        this.bubble(['😊','🦀','👋','🥰','😄'][Math.floor(Math.random()*5)]);
        this.load('happy');
        var self = this;
        setTimeout(function(){ self.load(self.currentState); }, 1200);
    },
    onDoubleTap() {
        this.bubble(['🎉','✨','💕','🦀🦀'][Math.floor(Math.random()*4)]);
        this.load('juggling');
        var self = this;
        setTimeout(function(){ self.load(self.currentState); }, 1500);
    },
    onLongPress() {
        this.bubble(['😤','😒','💢'][Math.floor(Math.random()*3)]);
        this.load('annoyed');
        var self = this;
        setTimeout(function(){ self.load(self.currentState); }, 1000);
    }
};
PET.init();
</script>
</body>
</html>
