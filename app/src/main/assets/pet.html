<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
}
#pet {
    width: 100%; height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
#pet img {
    width: 90%; height: 90%;
    object-fit: contain;
}
#bubble {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 60%;
    background: rgba(255,255,255,0.9);
    color: #333;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 9px;
    font-family: sans-serif;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
    max-width: 90%;
    line-height: 1.3;
    pointer-events: none;
    white-space: nowrap;
}
#bubble.show { opacity: 1; }
</style>
</head>
<body>
<div id="pet">
    <div id="bubble"></div>
</div>
<script>
var PET = {
    states: {
        idle:       { file: 'clawd-idle.gif',           text: '🦀' },
        thinking:   { file: 'clawd-thinking.gif',       text: '💭' },
        typing:     { file: 'clawd-typing.gif',          text: '⌨️' },
        working:    { file: 'clawd-typing.gif',          text: '⌨️' },
        charging:   { file: 'clawd-error.gif',           text: '🔋', once: true, onceDuration: 2000 },
        sleeping:   { file: 'clawd-sleeping.gif',        text: '💤' },
        celebrate:  { file: 'clawd-juggling.gif',        text: '🎉' },
        error:      { file: 'clawd-error.gif',           text: '😱', once: true, onceDuration: 2000 },
        happy:      { file: 'clawd-happy.gif',           text: '😊' },
        annoyed:    { file: 'clawd-error.gif',            text: '😤', once: true, onceDuration: 1500 },
        juggling:   { file: 'clawd-juggling.gif',        text: '🤹' },
        reading:    { file: 'clawd-idle-reading.gif',    text: '📖', once: true, onceDuration: 3000 },
        debugger:   { file: 'clawd-debugger.gif',        text: '🔍', once: true, onceDuration: 2500 },
        groove:     { file: 'clawd-headphones-groove.gif',text: '🎵', once: true, onceDuration: 3000 },
        bubble:     { file: 'clawd-bubble.gif',          text: '🫧' },
        building:   { file: 'clawd-building.gif',        text: '🔧' },
        carrying:   { file: 'clawd-carrying.gif',        text: '📦' },
        conducting: { file: 'clawd-conducting.gif',      text: '🎶' },
        notification: { file: 'clawd-notification.gif',   text: '🔔' },
        sweeping:   { file: 'clawd-sweeping.gif',        text: '🧹' },
        peek:       { file: 'clawd-mini-peek.gif',        text: '🦀 偷偷看' },
        mini:       { file: 'clawd-mini-idle.gif',        text: '🦀' },
    },
    currentState: 'idle', curFile: null, timer: null, onceTimer: null,

    init() { this.load('idle', '🦀'); window.petEngine = this; },

    load(state, text) {
        var s = this.states[state] || this.states.idle;
        if (s.file === this.curFile && state === this.currentState && !text) return;
        this.curFile = s.file;
        this.currentState = state;
        var pet = document.getElementById('pet');
        var img = pet.querySelector('img');
        if (img) { img.src = s.file; img.alt = state; }
        else { img = document.createElement('img'); img.src = s.file; img.alt = state; pet.appendChild(img); }
        if (text) this.bubble(text);
        else this.bubble(s.text);

        // Once-only playback: show GIF for one cycle, then freeze last frame
        if (this.onceTimer) clearTimeout(this.onceTimer);
        this.onceTimer = null;
        if (s.once) {
            var self = this;
            var loadState = state;
            this.onceTimer = setTimeout(function() {
                // Only freeze if we're still in the same state
                if (self.currentState === loadState) {
                    var petEl = document.getElementById('pet');
                    var imgEl = petEl.querySelector('img');
                    if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
                        var canvas = document.createElement('canvas');
                        canvas.width = imgEl.naturalWidth;
                        canvas.height = imgEl.naturalHeight;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(imgEl, 0, 0);
                        // Replace GIF with frozen frame (stops animation)
                        imgEl.src = canvas.toDataURL();
                    }
                }
            }, s.onceDuration || 2500);
        }
    },

    bubble(text) {
        var el = document.getElementById('bubble');
        if (!el) return;
        el.textContent = text;
        el.classList.add('show');
        if (this.timer) clearTimeout(this.timer);
        this.timer = setTimeout(function(){ el.classList.remove('show'); }, 2500);
    },

    setState(state, text) { this.load(state, text || ''); },

    onTap() {
        this.bubble(['😊','🦀','👋','🥰','😄'][Math.floor(Math.random()*5)]);
        this.load('happy', '');
        var self = this;
        setTimeout(function(){ self.load(self.currentState, ''); }, 1200);
    },
    onDoubleTap() {
        this.bubble(['🎉','✨','💕','🦀🦀'][Math.floor(Math.random()*4)]);
        this.load('juggling', '');
        var self = this;
        setTimeout(function(){ self.load(self.currentState, ''); }, 1500);
    },
    onLongPress() {
        this.bubble(['😤','😒','💢'][Math.floor(Math.random()*3)]);
        this.load('annoyed', '');
        var self = this;
        setTimeout(function(){ self.load(self.currentState, ''); }, 1000);
    }
};
PET.init();
</script>
</body>
</html>
