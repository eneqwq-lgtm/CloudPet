name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          # 检查 Android SDK 环境
          echo "ANDROID_HOME: $ANDROID_HOME"
          # 使用 sdkmanager 确保必要的组件
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          # 直接使用 gradle 命令
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudPet-debug
          path: app/build/outputs/apk/debug/app-debug.apk
