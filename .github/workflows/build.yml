name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudPet-debug
          path: "**/outputs/apk/debug/*.apk"
